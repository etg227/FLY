name: Windows Live Robustness v0.8.11

on:
  push:
    branches:
      - fix/v0.8.11-comprehensive-hardening
    paths:
      - "tests/windows_live_robustness.py"
      - ".github/workflows/windows-live-robustness-v0811.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-live:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm native Windows environment
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_OS / ${{ matrix.os }}"
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber
          whoami
          python -c "import os,sys,platform; assert os.name=='nt'; print(sys.version); print(platform.platform())"

      - name: Compile all sources
        shell: pwsh
        run: |
          python -m compileall -q main.py launcher.py backend tests

      - name: Full regression suite on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Repeat race suites five times
        shell: pwsh
        run: |
          $patterns = @(
            "test_robustness_fuzz.py",
            "test_core_integrity.py",
            "test_core_elevated_flow.py",
            "test_core_log_stream.py",
            "test_elevated_launch.py",
            "test_provider_index.py",
            "test_subscription_probe.py",
            "test_system_proxy.py",
            "test_selector_safety.py"
          )
          1..5 | ForEach-Object {
            Write-Host "WINDOWS RACE PASS $_ / 5"
            foreach ($pattern in $patterns) {
              python -m unittest discover -s tests -p $pattern -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Live Windows destructive robustness
        shell: pwsh
        env:
          FLY_WINDOWS_LIVE: "1"
        run: |
          python tests/windows_live_robustness.py -v

      - name: Build frozen launcher on Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --onefile --noconsole --name launcher launcher.py
          if (-not (Test-Path "dist\launcher.exe")) { throw "launcher.exe missing" }
          $size=(Get-Item "dist\launcher.exe").Length
          Write-Host "launcher.exe bytes=$size"
          if ($size -lt 5000000) { throw "launcher.exe unexpectedly small" }
