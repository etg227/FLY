name: Windows Real TUN Smoke

on:
  push:
    branches:
      - fix/v0.8.11-comprehensive-hardening
    paths:
      - "tests/windows_tun_live.py"
      - ".github/workflows/windows-tun-live.yml"

permissions:
  contents: read

jobs:
  tun-live:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real elevated TUN smoke
        shell: pwsh
        env:
          FLY_WINDOWS_TUN_LIVE: "1"
        run: |
          whoami
          python tests/windows_tun_live.py -v
