name: Release FLY

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q main.py launcher.py backend tests

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Repeat critical robustness tests
        shell: pwsh
        run: |
          $patterns = @(
            "test_robustness_fuzz.py",
            "test_core_integrity.py",
            "test_core_elevated_flow.py",
            "test_core_lifecycle.py",
            "test_core_log_stream.py",
            "test_core_ownership.py",
            "test_elevated_launch.py",
            "test_launcher_mutex.py",
            "test_launcher_bootstrap.py",
            "test_self_update.py",
            "test_provider_index.py",
            "test_subscription_probe.py",
            "test_system_proxy.py",
            "test_selector_safety.py"
          )
          1..3 | ForEach-Object {
            Write-Host "Release robustness pass $_ / 3"
            foreach ($pattern in $patterns) {
              python -m unittest discover -s tests -p $pattern -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Build standalone launcher.exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python scripts/build_launcher.py

      - name: Build verified update payload
        id: pack
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

          $stage = Join-Path $env:RUNNER_TEMP "fly-update"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $files = @("main.py","launcher.py","README.md","LICENSE","VERSION","START_FLY_DEBUG.bat",".gitignore")
          $dirs = @("backend","rules","scripts")
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f (Join-Path $stage $f) }
          }
          foreach ($d in $dirs) {
            if (Test-Path $d) { Copy-Item $d (Join-Path $stage $d) -Recurse }
          }
          Get-ChildItem $stage -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Copy-Item "dist\launcher.exe" (Join-Path $stage "launcher.exe.new") -Force

          $manifest = @{
            schema = 1
            managed_dirs = @("backend","rules","scripts")
            managed_root = @("main.py","launcher.py","README.md","LICENSE","START_FLY_DEBUG.bat",".gitignore","update-manifest.json","launcher.exe.new")
          } | ConvertTo-Json -Depth 4
          Set-Content (Join-Path $stage "update-manifest.json") $manifest -Encoding utf8

          $zip = Join-Path $PWD "dist\FLY-update.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FLY-update.zip" | Set-Content "dist\FLY-update.zip.sha256" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists; skipping duplicate release."
            exit 0
          }
          gh release create $tag "dist\launcher.exe#launcher.exe" "dist\FLY-update.zip#FLY-update.zip" "dist\FLY-update.zip.sha256#FLY-update.zip.sha256" --target "$env:GITHUB_SHA" --title "FLY $tag" --notes "FLY $tag includes the hardened Windows acceleration architecture plus a true standalone launcher: first run can restore the app and pinned Mihomo core from launcher.exe itself, reuses the embedded Python runtime, and does not require GitHub or a preinstalled Python before opening FLY. Windows regression and repeated robustness tests run before packaging."
