name: Test FLY

on:
  push:
    paths:
      - "**/*.py"
      - "tests/**"
      - "rules/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "tests/**"
      - "rules/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q main.py launcher.py backend tests

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Repeat race and robustness tests
        shell: pwsh
        run: |
          $patterns = @(
            "test_robustness_fuzz.py",
            "test_core_integrity.py",
            "test_provider_index.py",
            "test_subscription_probe.py",
            "test_system_proxy.py",
            "test_selector_safety.py"
          )
          1..3 | ForEach-Object {
            Write-Host "Robustness pass $_ / 3"
            foreach ($pattern in $patterns) {
              python -m unittest discover -s tests -p $pattern -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
