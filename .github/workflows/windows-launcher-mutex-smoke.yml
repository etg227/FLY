name: Windows Launcher Mutex Onefile Smoke

on:
  push:
    branches:
      - hotfix/v0.9.1-launcher-mutex
    paths:
      - "tests/windows_mutex_smoke_entry.py"
      - ".github/workflows/windows-launcher-mutex-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutex-onefile:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build one-file mutex probe
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --onefile --console --name fly-mutex-smoke --paths . tests/windows_mutex_smoke_entry.py
          if(-not (Test-Path "dist\fly-mutex-smoke.exe")){ throw "probe exe missing" }
      - name: Exercise one-file single-instance semantics
        shell: pwsh
        run: |
          $first = Join-Path $env:RUNNER_TEMP "mutex-first.txt"
          $second = Join-Path $env:RUNNER_TEMP "mutex-second.txt"
          $third = Join-Path $env:RUNNER_TEMP "mutex-third.txt"

          $p1 = Start-Process ".\dist\fly-mutex-smoke.exe" -ArgumentList @($first, "5") -PassThru
          $deadline = (Get-Date).AddSeconds(15)
          while((-not (Test-Path $first)) -and (Get-Date) -lt $deadline){ Start-Sleep -Milliseconds 100 }
          if(-not (Test-Path $first)){ throw "first probe never reported mutex state" }
          $r1=(Get-Content $first -Raw).Trim()
          Write-Host "first=$r1 pid=$($p1.Id)"
          if($r1 -ne "acquired"){ throw "first frozen process did not acquire mutex: $r1" }

          $p2 = Start-Process ".\dist\fly-mutex-smoke.exe" -ArgumentList @($second, "0") -PassThru -Wait
          if(-not (Test-Path $second)){ throw "second probe did not report mutex state" }
          $r2=(Get-Content $second -Raw).Trim()
          Write-Host "second=$r2"
          if($r2 -ne "existing"){ throw "second frozen process was not blocked: $r2" }

          Wait-Process -Id $p1.Id -Timeout 15
          $p3 = Start-Process ".\dist\fly-mutex-smoke.exe" -ArgumentList @($third, "0") -PassThru -Wait
          if(-not (Test-Path $third)){ throw "third probe did not report mutex state" }
          $r3=(Get-Content $third -Raw).Trim()
          Write-Host "third=$r3"
          if($r3 -ne "acquired"){ throw "mutex was not released after first process exit: $r3" }
