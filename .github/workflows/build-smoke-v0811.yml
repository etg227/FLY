name: FLY v0.8.11 Build Smoke

on:
  push:
    branches:
      - fix/v0.8.11-comprehensive-hardening
    paths:
      - ".github/workflows/build-smoke-v0811.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q main.py launcher.py backend tests
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build frozen launcher
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --onefile --noconsole --name launcher launcher.py
          if (-not (Test-Path "dist\launcher.exe")) { throw "launcher.exe missing" }
          $size = (Get-Item "dist\launcher.exe").Length
          if ($size -lt 5000000) { throw "launcher.exe unexpectedly small: $size" }

      - name: Build and inspect update payload
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "fly-update-smoke"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $files = @("main.py","launcher.py","README.md","LICENSE","VERSION","START_FLY_DEBUG.bat",".gitignore")
          $dirs = @("backend","rules","scripts")
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f (Join-Path $stage $f) }
          }
          foreach ($d in $dirs) {
            if (Test-Path $d) { Copy-Item $d (Join-Path $stage $d) -Recurse }
          }
          Get-ChildItem $stage -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Copy-Item "dist\launcher.exe" (Join-Path $stage "launcher.exe.new") -Force

          $manifest = @{
            schema = 1
            managed_dirs = @("backend","rules","scripts")
            managed_root = @("main.py","launcher.py","README.md","LICENSE","START_FLY_DEBUG.bat",".gitignore","update-manifest.json","launcher.exe.new")
          } | ConvertTo-Json -Depth 4
          Set-Content (Join-Path $stage "update-manifest.json") $manifest -Encoding utf8

          $zip = Join-Path $PWD "dist\FLY-update-smoke.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "update zip missing" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($z.Entries | ForEach-Object { $_.FullName.Replace("\","/") })
            foreach ($required in @("main.py","launcher.py","launcher.exe.new","update-manifest.json")) {
              if ($names -notcontains $required) { throw "missing payload entry: $required" }
            }
            foreach ($bad in @("private/","runtime/","core/")) {
              if ($names | Where-Object { $_.StartsWith($bad) }) { throw "protected data leaked into update: $bad" }
            }
          } finally {
            $z.Dispose()
          }
