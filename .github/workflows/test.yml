name: Test FLY

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "rules/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "tests/**"
      - "rules/**"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
